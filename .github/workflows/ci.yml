name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: go build -o cbmem .
      - run: ./cbmem version
      - run: |
          ./cbmem index . --json
          ls -lh ~/code-storage/second-brain/codebase/cbmem 2>/dev/null || ls -lh codebase/cbmem 2>/dev/null || ls -lh ./symbols.db 2>/dev/null || true
          cat ./map.md 2>/dev/null | head -20 || cat ~/code-storage/second-brain/codebase/cbmem/map.md 2>/dev/null | head -20 || true
